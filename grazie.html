<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Messaggio inviato | Artemisia Studio Danza</title>
  <style>
    @font-face{font-family:"Cormorant Garamond";src:url("assets/fonts/cormorant-garamond-normal-latin.woff2") format("woff2");font-style:normal;font-weight:400 500;font-display:swap}
    @font-face{font-family:"Inter";src:url("assets/fonts/inter-normal-latin.woff2") format("woff2");font-style:normal;font-weight:400 700;font-display:swap}
    :root{--plum:#4f0e82;--violet:#865ca1;--rose:#f6c3f7;--ink:#433742;--paper:#fffafd}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,rgba(246,195,247,.42),rgba(212,183,237,.34)),var(--paper);color:var(--ink);font-family:"Inter",Arial,sans-serif}
    main{width:min(680px,100%);padding:clamp(34px,7vw,68px);border:1px solid rgba(79,14,130,.14);border-radius:12px;background:rgba(255,255,255,.9);box-shadow:0 28px 80px rgba(67,55,66,.14);text-align:center}
    .mark{width:62px;height:62px;margin:0 auto 25px;display:grid;place-items:center;border-radius:50%;background:var(--plum);color:#fff;font-size:27px}
    .eyebrow{color:var(--violet);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:12px 0 18px;color:var(--plum);font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(44px,8vw,68px);font-weight:500;line-height:1}
    p{max-width:520px;margin:0 auto;color:rgba(67,55,66,.76);font-size:16px;line-height:1.75}
    a{min-height:50px;margin-top:30px;display:inline-flex;align-items:center;justify-content:center;padding:0 24px;border-radius:999px;background:var(--plum);color:#fff;font-size:12px;font-weight:700;letter-spacing:.1em;text-decoration:none;text-transform:uppercase;transition:transform .2s ease,background-color .2s ease}
    a:hover{transform:translateY(-2px);background:var(--violet)}
    a:focus-visible{outline:3px solid rgba(134,92,161,.25);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <span class="eyebrow">Richiesta ricevuta</span>
    <h1>Grazie per averci scritto.</h1>
    <p>Il messaggio è stato inviato correttamente. Artemisia Studio Danza ti risponderà appena possibile.</p>
    <a href="/index.html#contatti">Torna al sito</a>
  </main>
</body>
</html>
